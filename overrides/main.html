{% extends "base.html" %}

{% block extrahead %}
<!-- Flash-of-unstyled-content guard for Material's inline SVG icons.

     Material's chrome icons (logo, hamburger, search, palette toggle, footer
     arrows) are inline <svg viewBox="0 0 24 24"> with no width/height
     attributes — their size comes entirely from the stylesheet. With nothing
     applied they fall back to filling their container, so the header logo
     renders around 1500px square in solid black.

     That window is real because of navigation.instant: on every in-site
     navigation Material adds a fresh set of stylesheet <link> elements for the
     incoming page and removes the outgoing set in the same tick. The new links
     are new elements, so they apply only once loaded — and GitHub Pages serves
     our CSS with max-age=14400, so a first visit (or any visit past that
     window, needing a 304 revalidation) puts a network round trip in the
     middle, leaving the document with no stylesheets attached. The API page is
     where this is unmissable: its body is one iframe that has not painted yet,
     so the giant logo is the only thing on screen.

     Note when debugging locally: `mkdocs serve` sends no cache headers at all,
     so the dev server refetches every stylesheet on every navigation and
     flashes each time. That is not what production does — see the
     navigation.instant entry in CLAUDE.md's "Known constraints" for the
     measurements on both.

     Inline styles are part of the HTML and Material's head swap only touches
     <link> elements, so this rule stays applied throughout. :where() gives it
     zero specificity — the instant Material's own CSS attaches, its rules win
     and nothing about normal rendering changes. -->
<style>
    :where(.md-header, .md-tabs, .md-nav, .md-search, .md-sidebar, .md-footer) :where(svg) {
        width: 1.2rem;
        height: 1.2rem;
    }
</style>

<!-- Matomo: load tracker only (trackPageView fires via document$ below) -->
<script>
    var _paq = window._paq = window._paq || [];
    _paq.push(['enableLinkTracking']);
    (function () { var u = "//analytics.lib.virginia.edu/"; _paq.push(['setTrackerUrl', u + 'matomo.php']); _paq.push(['setSiteId', '55']); var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0]; g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s); }
    )();
</script>
<!-- End Matomo Code -->
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    /* Fire a Matomo page view on every navigation, including instant loading.
       document$ is Material for MkDocs' RxJS observable that emits on each
       page change — it covers both the initial load and all instant navigations. */
    document$.subscribe(function () {
        /* Matomo: track page view on every navigation */
        _paq.push(['setCustomUrl', 'https://docs.aptrust.org/docs.aptrust.org/' + window.location.pathname.replace(/^\//, '')]);
        _paq.push(['trackPageView']);

        /* WCAG 3.2.2 + general best practice: all external links should open
           in a new tab with accessible indicators. For every external link
           (http/https, not pointing to this site) in the content area:
             1. Set target="_blank" so it opens in a new tab.
             2. Add rel="noopener" (security — prevents window.opener access).
             3. Append a visually-hidden span so screen readers announce
                "opens in new tab" after the link text.
           The CSS a[target="_blank"]::after rule in extra.css then applies
           the ↗ icon automatically for sighted users.
           All three steps run on every page change (instant navigation). */
        /* WCAG 2.4.4 / 2.4.6: icon-only links in the header and page content use
           `title` for tooltips but `aria-label` is announced more reliably by
           screen readers. Copy title → aria-label where aria-label is absent.
           (The header repo widget this used to patch was removed entirely —
           see the comment in mkdocs.yml — since its star/fork counts had no
           accessible context even with a label on the link itself.) */
        document.querySelectorAll('a.md-content__button[title]').forEach(function (btn) {
            if (!btn.getAttribute('aria-label')) {
                btn.setAttribute('aria-label', btn.getAttribute('title'));
            }
        });

        /* Header toggles (drawer, search).

           overrides/partials/header.html renders these as real <button> elements
           instead of Material's <label for="__drawer"> / <label for="__search">.
           The hidden checkbox stays the state holder, so all of Material's
           CSS-only open/close behaviour is unchanged — these handlers are only
           the bridge, and they keep aria-expanded truthful.

           This replaced an earlier patch that set aria-label on the <label>
           elements. aria-label is prohibited on <label> (it maps to generic,
           which permits no name), so axe reported a serious aria-prohibited-attr
           violation on every page and screen readers still had nothing useful to
           announce — the same "ARIA cannot repair the wrong element" mistake the
           sidebar finding was about. */
        document.querySelectorAll('.md-header__button[data-md-toggle-target]').forEach(function (btn) {
            var cb = document.getElementById(btn.getAttribute('data-md-toggle-target'));
            if (!cb) return;
            btn.setAttribute('aria-expanded', String(cb.checked));
            if (btn.dataset.togglePatched) return;
            btn.dataset.togglePatched = '1';
            /* click() the checkbox rather than setting .checked: it fires the
               same input/change events a real label click would, which is what
               Material's own drawer and search observers listen for. */
            btn.addEventListener('click', function () {
                cb.click();
                /* Material focuses the search field from its own listener bound
                   to `header [for=__search]`. That selector used to match the
                   header's search <label>; now that the header control is a
                   <button>, it matches partials/search.html's overlay label
                   instead, so Material's focus never fires for this button.
                   Do it here rather than reintroducing a `for` attribute, which
                   is not valid on <button>. */
                if (cb.id === '__search' && cb.checked) {
                    var input = document.querySelector('.md-search__input');
                    if (input) input.focus();
                }
            });
            cb.addEventListener('change', function () {
                btn.setAttribute('aria-expanded', String(cb.checked));
            });
        });

        /* The palette toggles keep Material's markup. Their <input type="radio">
           is only visually hidden (height:0;opacity:0), so it stays focusable and
           in the accessibility tree, and Material already gives it a valid
           aria-label — the palette was already accessible. The sibling <label> is
           the visual icon only, so the prohibited aria-label an earlier patch put
           on it is removed and it is marked decorative, leaving exactly one
           control for AT instead of one control plus one nameless generic. */
        document.querySelectorAll('label.md-header__button[for^="__palette"]').forEach(function (el) {
            el.removeAttribute('aria-label');
            el.setAttribute('aria-hidden', 'true');
        });

        /* WCAG 1.1.1: SVGs inside header controls are decorative — the control's
           own aria-label is the accessible name. Hide the SVGs so screen readers
           don't announce them as unlabeled images. */
        document.querySelectorAll(
            '.md-header__button svg, .md-search__icon svg'
        ).forEach(function (svg) {
            svg.setAttribute('aria-hidden', 'true');
        });

        /* The overlay backdrop (base.html's label.md-overlay[for="__drawer"]) is
           decorative: it dims the page behind the open drawer and closes it on
           click. It is deliberately hidden from assistive technology.

           An earlier version gave it tabindex="0" + aria-label to make it a
           keyboard-operable close control. That was wrong twice over: aria-label
           is PROHIBITED on <label> (which has no role, so it maps to generic),
           which axe reports as a serious aria-prohibited-attr violation on every
           page; and being outside every landmark it also tripped the `region`
           rule. It was also redundant — keyboard and AT users have two real
           exits from the drawer already: the Close <button> at the top of the
           sidebar (partials/nav.html) and the Escape handler in the focus trap
           below. Mouse users keep the click-to-dismiss behaviour, which needs
           no attributes at all. */
        var overlay = document.querySelector('label.md-overlay[for="__drawer"]');
        if (overlay) {
            overlay.setAttribute('aria-hidden', 'true');
            overlay.setAttribute('tabindex', '-1');
            overlay.removeAttribute('aria-label');
        }


        /* WCAG 2.1.1: scrollable nav list regions must be keyboard-reachable.
           Safari will not auto-scroll an overflow container to reveal a focused
           child link unless the container itself has tabindex="0". We re-evaluate
           on every navigation because different pages expand different sections,
           changing which lists actually overflow. Lists that no longer overflow
           have the attribute removed so they don't create spurious tab stops. */
        function syncListTabstop(list) {
            /* A list inside a collapsed or covered drawer panel is
               visibility:hidden (see the drawer reflow rules in extra.css). It
               still has layout, so it still reports an overflow — but it must
               not advertise a tab stop the user cannot see. */
            var shown = window.getComputedStyle(list).visibility === 'visible';
            if (shown && list.scrollHeight > list.clientHeight) {
                if (!list.hasAttribute('tabindex')) list.setAttribute('tabindex', '0');
            } else if (list.getAttribute('tabindex') === '0') {
                list.removeAttribute('tabindex');
            }
        }
        document.querySelectorAll('.md-nav__list').forEach(syncListTabstop);

        /* Expanding or collapsing a drawer panel changes which lists are on
           screen, so the sweep above has to run again after the slide
           transition — otherwise a panel opened after page load never gets its
           scroll tab stop. */
        function resyncListTabstops() {
            setTimeout(function () {
                document.querySelectorAll('.md-nav__list').forEach(syncListTabstop);
            }, 300);
        }

        /* WCAG 4.1.1: expose the active nav item to assistive technologies.
           Material adds md-nav__link--active but no aria-current; screen readers
           can't determine which page is current without it. Re-run on every
           navigation so the correct item is always marked. */
        document.querySelectorAll('.md-nav__link[aria-current]').forEach(function (l) {
            l.removeAttribute('aria-current');
        });
        document.querySelectorAll('.md-nav__link--active').forEach(function (l) {
            l.setAttribute('aria-current', 'page');
        });

        /* Sidebar disclosure buttons.

           overrides/partials/nav-item.html renders every real expand/collapse
           control in the sidebar as <button aria-expanded aria-controls> instead
           of Material's <label for="__nav_N">. That gives them a role and an
           accessible name, which a <label> cannot have (ARIA in HTML permits no
           role on <label>, so the previous attribute-patching approach could
           never have worked). The hidden checkbox stays as the state holder so
           all of Material's `:checked ~ .md-nav` CSS keeps working untouched —
           these handlers are only the bridge between button and checkbox.

           Section headers are NOT in this set. They are real <h3>/<h4> elements
           with no aria-controls, are inert by design, and must stay that way. */
        document.querySelectorAll('.md-nav__link--toggle[aria-controls]').forEach(function (btn) {
            var cb = document.getElementById(btn.getAttribute('aria-controls').replace(/_content$/, ''));
            if (!cb) return;
            btn.setAttribute('aria-expanded', String(cb.checked));
            if (btn.dataset.togglePatched) return;
            btn.dataset.togglePatched = '1';
            btn.addEventListener('click', function () {
                cb.checked = !cb.checked;
                cb.dispatchEvent(new Event('change'));
                btn.setAttribute('aria-expanded', String(cb.checked));
                resyncListTabstops();
            });
            /* Material's own code (and the back buttons below) can move the
               checkbox without going through this button, so mirror it back. */
            cb.addEventListener('change', function () {
                btn.setAttribute('aria-expanded', String(cb.checked));
            });
        });

        /* Mobile drawer "back" controls. Each nested panel and the in-drawer
           table of contents has one; it closes its own panel.

           It used to be the whole panel header. That made the panel's visible
           title announce as a button rather than a heading, so nav-item.html and
           toc.html now split the header into a real heading plus this icon-only
           button — the control is a control, the heading is a heading. Only the
           button carries data-md-nav-back. */
        document.querySelectorAll('.md-nav__back-button[data-md-nav-back]').forEach(function (btn) {
            if (btn.dataset.backPatched) return;
            btn.dataset.backPatched = '1';
            btn.addEventListener('click', function () {
                var cb = document.getElementById(btn.getAttribute('data-md-nav-back'));
                if (cb) { cb.checked = false; cb.dispatchEvent(new Event('change')); }
                resyncListTabstops();
            });
        });

        /* Drawer Close button (real markup in overrides/partials/nav.html). The
           overlay backdrop can also close the drawer, but it lives outside
           .md-sidebar--primary and so is unreachable by Tab from inside the
           focus trap below — this is the in-trap way out. */
        document.querySelectorAll('.md-nav__close-button').forEach(function (btn) {
            if (btn.dataset.closePatched) return;
            btn.dataset.closePatched = '1';
            btn.addEventListener('click', function () {
                var cb = document.getElementById('__drawer');
                if (cb) { cb.checked = false; cb.dispatchEvent(new Event('change')); }
            });
        });

        /* WCAG 2.4.3: in mobile view the sidebar is off-screen when the drawer
           is closed — its links must be removed from the tab order so keyboard
           users don't land on invisible content. When the drawer opens, focus is
           moved inside and trapped until the user closes it (matching modal dialog
           behaviour). The IIFE + dataset.trapSetup guard ensures the change and
           matchMedia listeners are attached only once across instant navigations.
           #__drawer and its <label> live outside Material's instant-navigation
           container and are never replaced, so trapSetup (stored on drawerCb) is
           a reliable one-time guard — but .md-sidebar--primary IS inside that
           container and gets fully replaced on every in-app navigation, so it
           must always be looked up live via getSidebar() rather than captured
           in a closure (a stale reference silently breaks the trap after the
           first navigation, letting focus escape to the header search). */
        (function () {
            var drawerCb = document.getElementById('__drawer');
            /* Target the header hamburger specifically — querySelector would
               otherwise return the md-overlay label first in Material's DOM
               order, which is hidden (offsetParent null) whenever the drawer
               is closed, sending focus to an invisible element on close. */
            var dLabel = document.querySelector('.md-header__button[data-md-toggle-target="__drawer"]');
            if (!drawerCb || !document.querySelector('.md-sidebar--primary') || drawerCb.dataset.trapSetup) return;
            drawerCb.dataset.trapSetup = '1';

            function getSidebar() { return document.querySelector('.md-sidebar--primary'); }

            /* WCAG 2.4.3 / 1.4.10: match Material's actual CSS breakpoint for
               collapsing the sidebar into the off-canvas drawer (76.234375em,
               also used in extra.css) via matchMedia rather than a hardcoded
               window.innerWidth pixel check. innerWidth doesn't always shrink
               the way em-based media queries do under browser zoom, which let
               the sidebar stay focusable/AT-visible while visually off-screen
               at some zoomed/resized widths. */
            var mobileMql = window.matchMedia('(max-width: 76.234375em)');
            function isMobile() { return mobileMql.matches; }

            function setTabindex(open) {
                var sidebar = getSidebar();
                if (!sidebar) return;

                /* WCAG 1.3.1: hide the off-screen drawer from VoiceOver and other
                   AT. tabindex="-1" only removes keyboard tab stops — it does not
                   hide content from the screen-reader virtual cursor. aria-hidden
                   suppresses the entire sidebar from AT when it is off-screen on
                   mobile, preventing VoiceOver from announcing invisible content.

                   This MUST run before the per-element pass below. That pass asks
                   whether each element sits inside an aria-hidden subtree, and
                   while the drawer is closed the sidebar itself IS that subtree —
                   so doing it in the other order matched every element, forced
                   tabindex="-1" on all of them, and left the opened drawer with
                   nothing focusable at all (no initial focus, dead focus trap). */
                if (open) {
                    sidebar.removeAttribute('aria-hidden');
                } else {
                    sidebar.setAttribute('aria-hidden', 'true');
                }

                /* Same reasoning as the sweep above, applied to the state
                   change rather than to navigation: while the drawer is shut
                   the whole sidebar is off-screen, so no list inside it may
                   hold a tab stop. */
                sidebar.querySelectorAll('.md-nav__list').forEach(function (list) {
                    open ? syncListTabstop(list) : list.removeAttribute('tabindex');
                });

                sidebar.querySelectorAll('a, button').forEach(function (el) {
                    /* The sidebar logo is decorative (see partials/nav.html): it
                       duplicates the header's home link and is aria-hidden, so it
                       must keep tabindex="-1" even when the drawer opens —
                       a focusable node inside aria-hidden is itself a violation. */
                    if (el.closest('[aria-hidden="true"]')) {
                        el.setAttribute('tabindex', '-1');
                        return;
                    }
                    open ? el.removeAttribute('tabindex') : el.setAttribute('tabindex', '-1');
                });
            }

            /* The focusable set, as the user actually sees it.
               offsetParent alone is NOT enough: it is null only for
               display:none, position:fixed and detached nodes, so it does not
               notice the visibility:hidden that the drawer reflow rules in
               extra.css put on collapsed and covered panels. Without the
               visibility test the first/last calculation below would point at
               a hidden panel, initial focus would call .focus() on an
               unfocusable element, and Tab would walk straight out of the
               drawer. */
            function focusables(sidebar) {
                return Array.from(sidebar.querySelectorAll(
                    'a:not([tabindex="-1"]), button:not([tabindex="-1"])'
                )).filter(function (el) {
                    if (el.offsetParent === null) return false;
                    return window.getComputedStyle(el).visibility === 'visible';
                });
            }

            var trapHandler = null;

            function activateTrap() {
                setTabindex(true);
                trapHandler = function (e) {
                    /* WCAG 2.1.1 best practice: Escape closes the dialog and
                       returns focus to the triggering element, same as the
                       overlay/Close-button path. */
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        drawerCb.checked = false;
                        drawerCb.dispatchEvent(new Event('change'));
                        return;
                    }
                    if (e.key !== 'Tab') return;
                    var sidebar = getSidebar();
                    if (!sidebar) return;
                    var f = focusables(sidebar);
                    if (!f.length) return;
                    if (e.shiftKey && document.activeElement === f[0]) {
                        e.preventDefault(); f[f.length - 1].focus();
                    } else if (!e.shiftKey && document.activeElement === f[f.length - 1]) {
                        e.preventDefault(); f[0].focus();
                    }
                };
                document.addEventListener('keydown', trapHandler);
                /* Delay initial focus until the CSS slide-in animation finishes
                   (250ms transition). Calling focus() immediately moves focus to
                   an element that is still off-screen (left:-12.1rem + translateX
                   animating), which confuses VoiceOver's visual cursor. */
                setTimeout(function () {
                    var sidebar = getSidebar();
                    if (!sidebar) return;
                    var focusable = focusables(sidebar);
                    if (focusable.length) focusable[0].focus();
                }, 280);
            }

            function deactivateTrap() {
                if (trapHandler) {
                    document.removeEventListener('keydown', trapHandler);
                    trapHandler = null;
                }
                setTabindex(false);
                if (dLabel) dLabel.focus();
            }

            if (isMobile()) setTabindex(false);

            drawerCb.addEventListener('change', function () {
                if (isMobile()) { drawerCb.checked ? activateTrap() : deactivateTrap(); }
            });

            mobileMql.addEventListener('change', function (e) {
                if (!e.matches) {
                    if (trapHandler) {
                        document.removeEventListener('keydown', trapHandler);
                        trapHandler = null;
                    }
                    var sidebar = getSidebar();
                    if (sidebar) {
                        sidebar.querySelectorAll('[tabindex="-1"]').forEach(function (el) {
                            /* Leave the decorative logo alone — it is inside an
                               aria-hidden subtree and must stay unfocusable at
                               every width (see setTabindex above). */
                            if (el.closest('[aria-hidden="true"]')) return;
                            el.removeAttribute('tabindex');
                        });
                        sidebar.removeAttribute('aria-hidden');
                    }
                } else if (!drawerCb.checked) {
                    setTabindex(false);
                }
            });
        }());

        /* WCAG 2.4.1: validate the skip-to-content link on every page.
           On the homepage the generated anchor (#aptrust-documentation) may not
           exist in the rendered DOM — Material absorbs the H1 into the page
           header rather than emitting it with an id in the content area. If the
           target is missing, redirect the skip link to the main content wrapper
           so keyboard and AT users can always bypass navigation. */
        (function () {
            var skipLink = document.querySelector('a.md-skip');
            if (!skipLink) return;
            var anchor = (skipLink.getAttribute('href') || '').replace(/^#/, '');
            if (anchor && !document.getElementById(anchor)) {
                var main = document.querySelector('.md-content__inner');
                if (main) {
                    if (!main.id) main.id = 'main-content';
                    skipLink.setAttribute('href', '#main-content');
                }
            }
        }());

        /* Swagger UI iframe patches — accessibility, plus a sizing/theming
           fallback for instant navigation.

           WCAG 4.1.2: the swagger-ui-tag plugin renders iframes without a
           title, making them opaque to screen readers.

           The sizing fallback exists because the plugin appends its control
           script to the end of <body>, outside [data-md-component=container]
           — the only region Material replaces (and re-executes scripts in)
           during instant navigation. Reaching /api/ from any in-site link
           therefore leaves the iframe at its default ~150px height, so the
           API reference looks like it failed to load, and leaves it stuck in
           light mode; only a hard refresh fixed it. The plugin's script does
           four things, all of which we reproduce here:
             1. window.__init_is_dark_mode — read by the iframe as it boots.
             2. window.update_swagger_ui_iframe_height(id) — called back by
                the iframe whenever its content grows (first render, and
                every time an endpoint is expanded).
             3. a scroll listener feeding the iframe the viewport midpoint.
             4. a palette observer toggling dark mode inside the iframe.
           We do not try to detect whether the plugin's script ran: on an
           instant navigation the tag is present in the DOM but unexecuted, so
           its presence proves nothing, and it registers its own document$
           subscriber immediately after this one, so probing for its globals
           always comes up empty. Everything below is written to be harmless
           if the plugin's copy also runs — identical values, and one-time
           document-level listeners. */
        (function () {
            var iframes = document.querySelectorAll('iframe.swagger-ui-iframe');
            if (!iframes.length) return;

            iframes.forEach(function (iframe) {
                if (!iframe.hasAttribute('title')) {
                    iframe.setAttribute('title', 'APTrust Member API Reference');
                }
            });

            var DARK_SCHEME = 'slate';

            function isDarkMode() {
                if (document.body.getAttribute('data-md-color-media') === '(prefers-color-scheme: dark)') {
                    return window.getComputedStyle(document.body)
                        .getPropertyValue('color-scheme').trim() === 'dark';
                }
                return document.body.getAttribute('data-md-color-scheme') === DARK_SCHEME;
            }

            function applyScheme(iframe) {
                try {
                    var w = iframe.contentWindow;
                    if (!w || !w.enable_dark_mode) return;
                    isDarkMode() ? w.enable_dark_mode() : w.disable_dark_mode();
                } catch (e) { /* iframe not ready yet */ }
            }

            /* Must be set before the iframe's own boot script reads it. */
            window.__init_is_dark_mode = isDarkMode();

            if (typeof window.update_swagger_ui_iframe_height !== 'function') {
                window.update_swagger_ui_iframe_height = function (id) {
                    var iframe = document.getElementById(id);
                    if (!iframe) return;
                    try {
                        var h = (iframe.contentWindow.document.body.scrollHeight + 80) + 'px';
                        iframe.height = h;
                        iframe.style.height = h;
                    } catch (e) { /* iframe not ready yet */ }
                };
            }

            iframes.forEach(function (iframe) {
                if (iframe.dataset.swaggerSized) return;
                iframe.dataset.swaggerSized = '1';

                /* Watch the iframe's own document rather than sizing once:
                   a single measurement is easy to take at the wrong moment
                   (the document reports readyState "complete" while Swagger
                   UI has still rendered nothing, which pins the iframe at the
                   80px padding and leaves nothing to correct it). The observer
                   fires an initial callback on observe() and again on every
                   later reflow, which also covers expanding an endpoint
                   without depending on the iframe calling back out. */
                function watch() {
                    if (iframe.dataset.swaggerObserved || typeof ResizeObserver !== 'function') return;
                    try {
                        var body = iframe.contentWindow.document.body;
                        iframe.dataset.swaggerObserved = '1';
                        new ResizeObserver(function () {
                            try {
                                var wanted = iframe.contentWindow.document.body.scrollHeight + 80;
                                /* Hysteresis: resizing the iframe resizes its
                                   viewport, so only react to real content
                                   changes or this can chase its own tail. */
                                if (Math.abs(wanted - iframe.getBoundingClientRect().height) > 4) {
                                    window.update_swagger_ui_iframe_height(iframe.id);
                                }
                            } catch (e) { /* iframe went away */ }
                        }).observe(body);
                    } catch (e) { /* iframe not ready yet */ }
                }

                iframe.addEventListener('load', function () {
                    applyScheme(iframe);
                    watch();
                });

                /* A cached iframe document can be complete before the listener
                   above is attached. about:blank is skipped: it reports
                   readyState "complete" while the real document is still on
                   its way. */
                try {
                    if (iframe.contentWindow.document.readyState === 'complete' &&
                        iframe.contentWindow.location.href !== 'about:blank') {
                        applyScheme(iframe);
                        watch();
                    }
                } catch (e) { /* iframe not ready yet */ }
            });

            /* Document-level listeners survive instant navigation along with
               window, so install them only on the first API page visit. */
            if (window.__swaggerListenersInstalled) return;
            window.__swaggerListenersInstalled = true;

            /* The iframe renders its operations relative to the viewport
               midpoint, which only the parent can measure. */
            var ticking = false;
            document.addEventListener('scroll', function () {
                if (ticking) return;
                ticking = true;
                window.requestAnimationFrame(function () {
                    var midpoint = window.innerHeight / 2;
                    document.querySelectorAll('iframe.swagger-ui-iframe').forEach(function (el) {
                        try {
                            if (el.contentWindow.update_top_val) {
                                el.contentWindow.update_top_val(midpoint - el.getBoundingClientRect().top);
                            }
                        } catch (e) { /* iframe not ready yet */ }
                    });
                    ticking = false;
                });
            });

            new MutationObserver(function () {
                document.querySelectorAll('iframe.swagger-ui-iframe').forEach(applyScheme);
            }).observe(document.body, { attributeFilter: ['data-md-color-scheme'] });
        }());

        document.querySelectorAll('.md-typeset a[href^="http"]').forEach(function (link) {
            /* Skip links that point to this same site */
            if (link.hostname === location.hostname) return;

            /* Open in new tab */
            link.setAttribute('target', '_blank');

            /* Security: ensure rel contains noopener */
            var rel = (link.getAttribute('rel') || '').split(' ').filter(Boolean);
            if (!rel.includes('noopener')) {
                rel.push('noopener');
                link.setAttribute('rel', rel.join(' '));
            }

            /* Accessibility: add screen-reader announcement if not already present */
            if (!link.querySelector('.new-tab-label')) {
                var span = document.createElement('span');
                span.className = 'new-tab-label sr-only';
                span.textContent = ' (opens in new tab)';
                link.appendChild(span);
            }
        });
    });
</script>
{% endblock %}
