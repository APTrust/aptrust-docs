# repo_url / repo_name intentionally omitted: Material's header repo widget
# (icon + name + star/fork counts) is not accessible to screen readers and
# provided no value to doc readers, so it was removed rather than patched.
site_name: APTrust Documentation
site_url: https://docs.aptrust.org/
docs_dir: docs

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - search.highlight

plugins:
  - search
  - monorepo
  # mkdocs-monorepo-plugin reads only `nav` and `docs_dir` out of each sub-repo's
  # mkdocs.yml — it never runs their `plugins:` blocks. userguide declares these
  # two redirects in repos/userguide/mkdocs.yml, so before this they were simply
  # dropped and /user-guide/bagging/ 404'd on the live site. Re-declared here
  # against the *merged* tree, which is why the paths carry the `user-guide/`
  # prefix that monorepo adds. Must stay after `monorepo`: mkdocs-redirects
  # resolves targets in on_files, so the merge has to have happened first, and an
  # unresolvable target is only a warning, not an error.
  - redirects:
      redirect_maps:
        'user-guide/bagging/index.md': 'user-guide/depositing/index.md'
        'user-guide/bagging/tools.md': 'user-guide/depositing/tools.md'
  - swagger-ui-tag

markdown_extensions:
  - attr_list
  - admonition
  - markdown_include.include:
      base_path: docs
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - md_in_html

nav:
  - Home: index.md
  - User Guide: '!include ./repos/userguide/mkdocs.yml'
  - DART: '!include ./repos/dart/mkdocs.yml'
  - Partner Tools: user-guide/partner_tools.md
  - API: api.md
  - Registry: '!include ./repos/registry/mkdocs.yml'
  - Preservation Services: '!include ./repos/preserv/mkdocs.yml'  
  - Other Documentation: documentation.md
  - Policies: policies.md
